<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Наталья Тимохина — Неолоджик</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --peach-bg: #f0e0d3;
    --peach-soft: #f7e9dd;
    --coral: #e8643d;
    --coral-soft: #f08868;
    --olive: #6b8e2f;
    --olive-dark: #5a7826;
    --ink: #1f1d1b;
    --ink-soft: #514c46;
    --muted: #8a7f74;
    --line: #e6d5c5;
    --white: #ffffff;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
  body {
    font-family: 'Manrope', system-ui, sans-serif;
    background: var(--peach-bg);
    color: var(--ink);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: stretch;
  }

  .container {
    width: 100%;
    max-width: 440px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    background: var(--peach-bg);
    position: relative;
    overflow: hidden;
  }

  /* Coral header */
  .top {
    background: var(--coral);
    color: white;
    padding: 32px 26px 30px;
    text-align: center;
    border-bottom-left-radius: 32px;
    border-bottom-right-radius: 32px;
    position: relative;
    opacity: 0;
    animation: fadeUp .8s ease .1s forwards;
  }
  .top::before {
    content: '';
    position: absolute;
    top: -50px; right: -60px;
    width: 180px; height: 180px;
    border-radius: 50%;
    background: rgba(255,255,255,.08);
  }
  .top::after {
    content: '';
    position: absolute;
    bottom: -30px; left: -50px;
    width: 140px; height: 140px;
    border-radius: 50%;
    background: rgba(0,0,0,.04);
  }

  .logo-row {
    display: flex; align-items: center; justify-content: center;
    gap: 8px;
    font-size: 14px; font-weight: 700;
    margin-bottom: 22px;
    position: relative; z-index: 2;
  }
  .logo-mk {
    width: 28px; height: 28px;
    object-fit: contain;
    background: transparent;
  }

  .avatar {
    width: 110px; height: 110px;
    border-radius: 50%;
    margin: 0 auto 16px;
    overflow: hidden;
    border: 3px solid rgba(255,255,255,.55);
    box-shadow: 0 10px 24px -10px rgba(0,0,0,.25);
    position: relative; z-index: 2;
    background: linear-gradient(135deg, #fff1e3, #fbcdb3);
  }
  .avatar img {
    width: 100%; height: 100%;
    object-fit: cover;
    display: block;
  }

  .name {
    font-size: 28px; font-weight: 800;
    line-height: 1.1; letter-spacing: -0.02em;
    margin-bottom: 6px;
    position: relative; z-index: 2;
  }
  .company {
    font-size: 13px; opacity: .92; line-height: 1.4;
    margin-bottom: 14px;
    position: relative; z-index: 2;
  }
  .pill {
    display: inline-block;
    background: rgba(255,255,255,.22);
    padding: 5px 14px;
    border-radius: 999px;
    font-size: 11px; font-weight: 500;
    letter-spacing: .08em; text-transform: uppercase;
    position: relative; z-index: 2;
  }

  /* Body — contact list */
  .body {
    flex: 1;
    padding: 22px 22px 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    animation: fadeUp .8s ease .25s forwards;
  }

  .item {
    background: white;
    border-radius: 14px;
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 14px;
    text-decoration: none;
    color: var(--ink);
    border: 1px solid transparent;
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .item:hover, .item:active {
    transform: translateY(-1px);
    border-color: var(--line);
    box-shadow: 0 6px 18px -10px rgba(0,0,0,.1);
  }
  .item-ico {
    width: 38px; height: 38px;
    border-radius: 11px;
    background: var(--peach-soft);
    color: var(--coral);
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .item-ico svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .item-text { flex: 1; min-width: 0; }
  .item-label {
    color: var(--muted);
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 2px;
  }
  .item-val {
    color: var(--ink);
    font-weight: 500;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Action buttons */
  .actions {
    padding: 6px 22px 22px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    opacity: 0;
    animation: fadeUp .8s ease .4s forwards;
  }
  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 15px 18px;
    border-radius: 999px;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 600;
    border: none;
    cursor: pointer;
    text-decoration: none;
    transition: all .25s ease;
  }
  .btn svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .btn-primary {
    background: var(--olive);
    color: white;
  }
  .btn-primary:hover {
    background: var(--olive-dark);
    transform: translateY(-1px);
    box-shadow: 0 10px 24px -12px rgba(107,142,47,.5);
  }
  .btn-secondary {
    background: transparent;
    border: 1.5px solid var(--ink);
    color: var(--ink);
    padding: 13px 18px;
    font-weight: 500;
    font-size: 13px;
  }
  .btn-secondary:hover {
    background: var(--ink);
    color: white;
  }

  /* Footer */
  .footer {
    padding: 8px 22px 26px;
    text-align: center;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: .04em;
  }
  .footer a { color: var(--ink-soft); text-decoration: none; }

  /* Modal */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(31,29,27,.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    z-index: 100;
    justify-content: center;
    align-items: flex-end;
    padding: 12px;
  }
  .modal-overlay.active { display: flex; animation: fadeIn .25s ease; }
  .modal {
    background: white;
    border-radius: 24px 24px 18px 18px;
    width: 100%;
    max-width: 420px;
    max-height: 88vh;
    overflow-y: auto;
    padding: 26px 22px 22px;
    animation: slideUp .35s ease;
  }
  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 18px;
  }
  .modal-title { font-size: 20px; font-weight: 700; color: var(--ink); }
  .modal-close {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: var(--peach-soft);
    border: none;
    color: var(--ink-soft);
    font-size: 20px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .modal-close:hover { background: var(--peach-bg); }

  .form-group { margin-bottom: 12px; }
  .form-label {
    display: block;
    font-size: 11px; font-weight: 500;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: .08em;
    margin-bottom: 6px;
  }
  .form-input {
    width: 100%;
    padding: 13px 14px;
    border-radius: 12px;
    border: 1.5px solid var(--line);
    background: #fbf6f1;
    color: var(--ink);
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color .2s;
  }
  .form-input:focus { border-color: var(--coral); background: white; }
  .form-input::placeholder { color: var(--muted); }
  .form-submit {
    width: 100%;
    padding: 14px;
    border-radius: 999px;
    background: var(--olive);
    color: white;
    font-family: 'Manrope', sans-serif;
    font-size: 14px; font-weight: 600;
    border: none;
    cursor: pointer;
    margin-top: 8px;
    transition: all .25s ease;
  }
  .form-submit:hover { background: var(--olive-dark); }
  .form-submit:disabled { opacity: .5; cursor: not-allowed; }

  .form-success { text-align: center; padding: 20px 0; }
  .form-success .check {
    width: 56px; height: 56px;
    border-radius: 50%;
    background: var(--peach-soft);
    color: var(--coral);
    display: flex; align-items: center; justify-content: center;
    margin: 0 auto 14px;
  }
  .form-success .check svg { width: 28px; height: 28px; stroke-width: 2.5; }
  .form-success p { color: var(--ink-soft); font-size: 14px; line-height: 1.5; }

  .toast {
    position: fixed; bottom: 22px; left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--ink); color: white;
    padding: 11px 22px; border-radius: 12px;
    font-size: 13px; z-index: 200;
    transition: transform .35s ease;
    pointer-events: none;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
</style>
</head>

<script>
function downloadVCard() {
  const vcard = `BEGIN:VCARD
VERSION:3.0
N:Тимохина;Наталья;Николаевна;;
FN:Наталья Николаевна Тимохина
ORG:ООО «Неолоджик»
TITLE:Генеральный директор
TEL;TYPE=CELL:+79212276511
EMAIL;TYPE=WORK:n.timokhina@neologik.ru
URL:https://meritoscope.ru/
ADR;TYPE=WORK:;;Невский пр.\\, д.104\\, лит. 6\\, оф. 416-3;Санкт-Петербург;;;Россия
NOTE:Telegram: @Nataellil
END:VCARD`;
  const blob = new Blob([vcard], { type: 'text/vcard;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'Тимохина_Наталья.vcf';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('Контакт сохранён');
}

function openContactForm() {
  document.getElementById('contactModal').classList.add('active');
  document.getElementById('formContent').style.display = 'block';
  document.getElementById('formSuccess').style.display = 'none';
}
function closeContactForm() {
  document.getElementById('contactModal').classList.remove('active');
}
document.getElementById('contactModal').addEventListener('click', function(e) {
  if (e.target === this) closeContactForm();
});

function submitForm() {
  const name = document.getElementById('cfName').value.trim();
  const phone = document.getElementById('cfPhone').value.trim();
  const email = document.getElementById('cfEmail').value.trim();
  const company = document.getElementById('cfCompany').value.trim();
  const note = document.getElementById('cfNote').value.trim();
  if (!name || !phone) { showToast('Заполните имя и телефон'); return; }

  const BOT_TOKEN = 'ВАШ_ТОКЕН_БОТА';
  const CHAT_ID = 'ВАШ_CHAT_ID';
  const text = `📇 *Новый контакт с визитки*\n\n👤 *Имя:* ${name}\n📱 *Телефон:* ${phone}${email ? '\n📧 *Email:* ' + email : ''}${company ? '\n🏢 *Компания:* ' + company : ''}${note ? '\n💬 *Комментарий:* ' + note : ''}\n\n🕐 ${new Date().toLocaleString('ru-RU')}`;

  const btn = document.getElementById('formSubmit');
  btn.disabled = true;
  btn.textContent = 'Отправка...';

  if (BOT_TOKEN === 'ВАШ_ТОКЕН_БОТА') {
    setTimeout(() => {
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('formSuccess').style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Отправить';
    }, 600);
    return;
  }

  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' })
  })
  .then(r => r.json())
  .then(data => {
    if (data.ok) {
      document.getElementById('formContent').style.display = 'none';
      document.getElementById('formSuccess').style.display = 'block';
    } else { showToast('Ошибка отправки'); }
  })
  .catch(() => showToast('Нет соединения'))
  .finally(() => {
    btn.disabled = false;
    btn.textContent = 'Отправить';
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}
</script>
